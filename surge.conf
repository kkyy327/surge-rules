# surge-rules 配套 Surge 配置模板
# 把 [Proxy]
# ⚠️ 这里填你自己的节点：删掉行首的 #、换成真实参数即可
# 节点名自己起，但要和下面 [Proxy Group]、[Rule] 里引用的名字对上（改名就同步改引用）
# 香港-1 = snell, 1.2.3.4, 2345, psk=YOUR_PSK, version=4
# 美国-1 = snell, 1.2.3.4, 2345, psk=YOUR_PSK, version=4
# 日本-1 = snell, 1.2.3.4, 2345, psk=YOUR_PSK, version=4
# 新加坡-1 = anytls, 1.2.3.4, 443, password=YOUR_PASSWORD, skip-cert-verify=true

[Proxy Group]
# 手动选择出口
Proxy = select, Auto, 香港节点, 美国节点, 日本节点, 新加坡节点, 香港-1, 美国-1, 日本-1, 新加坡-1, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://iili.io/KyQjMVp.png
Auto = url-test, 香港-1, 美国-1, 日本-1, 新加坡-1, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, no-alert=0, hidden=1, include-all-proxies=0
AI = select, 美国-1, 日本-1, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/ChatGPT1.png

# ── 地区节点组（按节点名自动筛选，机场导入的节点也会自动归组） ──
香港节点 = select, include-all-proxies=1, policy-regex-filter=🇭🇰|香港|HK
美国节点 = select, include-all-proxies=1, policy-regex-filter=🇺🇸|美国|洛杉矶|纽约|圣何塞|西雅图|芝加哥|达拉斯|LAX|SFO
新加坡节点 = select, include-all-proxies=1, policy-regex-filter=🇸🇬|新加坡|狮城|SG
日本节点 = select, include-all-proxies=1, policy-regex-filter=🇯🇵|日本|东京|大阪|JP
韩国节点 = select, include-all-proxies=1, policy-regex-filter=🇰🇷|韩国|首尔|KR
台湾节点 = select, include-all-proxies=1, policy-regex-filter=🇹🇼|台湾|台北|TW
# ── 机场节点（导入机场订阅后，全部节点都在这一组里选） ──
机场节点 = select, include-all-proxies=1
# ── 社交 ──
𝕏 = select, 香港节点, 美国节点, Proxy

[Rule]
PROTOCOL,MTProto,香港-1
DOMAIN,voice.google.com,美国-1
RULE-SET,https://raw.githubusercontent.com/MiCat-S/Rule/refs/heads/main/rules/surge/IPCheck.list,Proxy
RULE-SET,https://cdn.jsdelivr.net/gh/kkyy327/surge-rules@main/rules/Reject.list,REJECT
# ── 专用规则（必须放在通用 Proxy 规则集之前） ──
RULE-SET,https://cdn.jsdelivr.net/gh/kkyy327/surge-rules@main/rules/WhatsApp.list,香港节点
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Twitter/Twitter.list,𝕏
RULE-SET,https://cdn.jsdelivr.net/gh/kkyy327/surge-rules@main/rules/Nimbus.list,Proxy
RULE-SET,https://cdn.jsdelivr.net/gh/kkyy327/surge-rules@main/rules/Cirrus.list,Proxy
RULE-SET,https://cdn.jsdelivr.net/gh/kkyy327/surge-rules@main/rules/Stratus.list,Proxy
# ── AI（Apple 智能/Siri，必须放在 Apple 直连规则之前） ──
RULE-SET,https://cdn.jsdelivr.net/gh/kkyy327/surge-rules@main/rules/AI.list,AI
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Apple/Apple.list,DIRECT
# ── 自有规则（115302zl） ──
RULE-SET,https://cdn.jsdelivr.net/gh/kkyy327/115302zl@main/115320-rules.list,DIRECT
# 国内服务直连(微信/支付宝/银行/京东/B站等，含微信 ASN 规则)
RULE-SET,https://cdn.jsdelivr.net/gh/kkyy327/surge-rules@main/rules/Direct.list,DIRECT
GEOIP,CN,DIRECT
FINAL,Proxy,dns-failed

[Host]
# 本地 hosts, 按需添加
# example.com = 1.2.3.4

[URL Rewrite]
# "按需添加," 默认空 header

[MITM]
skip-server-cert-verify = true
h2 = true
hostname = image.tmdb.org, api.themoviedb.org, cdn.wtzw.com, api-gw.wtzw.com, api-bc.wtzw.com, sf3-fe-tos.pglstatp-toutiao.com, api-cfg.wtzw.com
# 在 Surge 里生成你自己的 CA，把下面两行换成你的（不要用别人的证书！）
# ca-passphrase = YOUR_CA_PASSPHRASE
# ca-p12 = YOUR_CA_P12_BASE64

[MTProto]
interface = 127.0.0.1
port = 5753
secret = YOUR_MTPROTO_SECRET
ipv6 = true
dc-config-url = https://github.com/Repcz/Tool/raw/X/Surge/mtproto-dc-config.json
